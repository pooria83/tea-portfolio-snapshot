name: CI/CD

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main]

env:
  UV_VERSION: "0.11"
  PYTHON_VERSION: "3.13"
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/tea-assist/product-graph-api

permissions:
  contents: read
  packages: write

jobs:
  quality:
    runs-on: [self-hosted, tea-server]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Restore uv cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Start test postgres
        run: |
          docker rm -f test-pg 2>/dev/null || true
          docker run -d --network host --name test-pg \
            -e POSTGRES_DB=product_graph -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres \
            postgres:16-alpine -p 55432
          for i in $(seq 1 30); do
            docker exec test-pg pg_isready -p 55432 -U postgres >/dev/null 2>&1 && break
            sleep 1
          done

      - name: Start test redis
        run: |
          docker rm -f test-redis 2>/dev/null || true
          docker run -d --network host --name test-redis redis:7-alpine --port 56379
          for i in $(seq 1 30); do
            docker exec test-redis redis-cli -p 56379 ping >/dev/null 2>&1 && break
            sleep 1
          done

      - name: Lint
        run: uv run ruff check app/ tests/ scripts/

      - name: Format check
        run: uv run ruff format app/ tests/ scripts/ --check

      - name: Type check
        run: uv run mypy app/

      - name: Test
        run: uv run pytest --cov-fail-under=60
        env:
          DATABASE_URL: postgresql+asyncpg://<REDACTED>@localhost/portfolio
          TEST_DATABASE_URL: postgresql+asyncpg://<REDACTED>@localhost/portfolio
          REDIS_URL: redis://localhost:56379/0
          SECRET_KEY: ${{ secrets.SECRET_KEY || 'ci-secret-key' }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY || 'ci-jwt-secret' }}
          API_KEY: ${{ secrets.API_KEY || 'ci-api-key' }}

      - name: Stop test containers
        if: always()
        run: docker rm -f test-pg test-redis 2>/dev/null || true

      - name: Generate OpenAPI schema
        run: uv run python -c "import json; from app.main import app; json.dump(app.openapi(), open('/tmp/openapi.json','w'))"

      - name: Upload OpenAPI schema
        uses: actions/upload-artifact@v7
        with:
          name: openapi-schema
          path: /tmp/openapi.json

  build-and-push:
    runs-on: [self-hosted, tea-server]
    needs: quality
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        shell: bash
        run: |
          set -e
          for attempt in 1 2 3; do
            if docker buildx build --file Dockerfile --target production \
                --push --tag "$IMAGE_NAME:main" \
                --build-arg GIT_SHA=${{ github.sha }} \
                --cache-from type=gha --cache-to type=gha,mode=max \
                .; then
              exit 0
            fi
            echo "Build failed (attempt $attempt/3) - retrying after 30s"
            sleep 30
            docker system prune -af >/dev/null 2>&1 || true
          done
          exit 1

  generate-client:
    runs-on: [self-hosted, tea-server]
    needs: quality
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Download OpenAPI schema
        uses: actions/download-artifact@v8
        with:
          name: openapi-schema
          path: /tmp

      - name: Generate TypeScript client
        run: scripts/generate_ts_types.sh /tmp/openapi.json

      - name: Upload client artifact
        uses: actions/upload-artifact@v7
        with:
          name: api-client-types
          path: api-client-types/

  docker:
    runs-on: [self-hosted, tea-server]
    needs: quality
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/staging'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        shell: bash
        run: |
          set -e
          for attempt in 1 2 3; do
            if docker buildx build --file Dockerfile --target production \
                --tag "product-graph-api:${{ github.sha }}" \
                --build-arg GIT_SHA=${{ github.sha }} \
                --cache-from type=gha --cache-to type=gha,mode=max \
                .; then
              exit 0
            fi
            echo "Build failed (attempt $attempt/3) - retrying after 30s"
            sleep 30
            docker system prune -af >/dev/null 2>&1 || true
          done
          exit 1

  migrate:
    runs-on: [self-hosted, tea-server]
    needs: [build-and-push, generate-client]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Run database migrations via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: 192.0.2.10
          username: tea
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 120s
          script: |
            printf '%s\n' '${{ secrets.SERVER_PASSWORD }}' | su -c '
              set -a && source /opt/tea-assist/product-graph-infra/.env && set +a

              echo "Logging in to ghcr.io..."
              echo "${{ secrets.GHCR_PULL_TOKEN }}" | docker login ghcr.io -u radiophp --password-stdin || { echo "FATAL: ghcr.io login failed - check GHCR_PULL_TOKEN secret"; exit 1; }

              echo "Pulling new image..."
              docker pull ghcr.io/tea-assist/product-graph-api:main

              echo "Running database migrations..."
              docker run --rm --network tea-infra-net \
                -e DATABASE_URL="postgresql+asyncpg://<REDACTED>@localhost/portfolio" \
                -e DATABASE_URL_SYNC="postgresql://<REDACTED>@localhost/portfolio" \
                -e PYTHONPATH=/app \
                ghcr.io/tea-assist/product-graph-api:main \
                alembic upgrade head
              if [ $? -ne 0 ]; then
                echo "Migration failed — aborting deploy"
                exit 1
              fi
            ' -s /bin/bash tea

  deploy:
    runs-on: [self-hosted, tea-server]
    needs: migrate
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy stack via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: 192.0.2.10
          username: tea
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 600s
          script: |
            printf '%s\n' '${{ secrets.SERVER_PASSWORD }}' | su -c '
              export MINIO_PUBLIC_URL=${{ vars.MINIO_PUBLIC_URL }}
              set -a && source /opt/tea-assist/product-graph-infra/.env && set +a
              echo "Logging in to ghcr.io..."
              echo "${{ secrets.GHCR_PULL_TOKEN }}" | docker login ghcr.io -u radiophp --password-stdin || { echo "FATAL: ghcr.io login failed - check GHCR_PULL_TOKEN secret"; exit 1; }
              echo "Pulling images (a failed pull must abort the deploy, otherwise stale containers keep running)..."
              for img in product-graph-ai-engine product-graph-api product-graph-web-ui; do
                docker pull "ghcr.io/tea-assist/$img:main" || { echo "FATAL: docker pull of $img:main failed - aborting deploy"; exit 1; }
              done
              # Serialize stack updates across repos with flock+retry: concurrent deploy
              # jobs can hit "update out of sequence" on the same service.
              DEPLOYED=0
              for attempt in 1 2 3 4 5; do
                if flock -w 300 /tmp/tea-stack-deploy.lock bash -c "
                  # --detach=false: wait for the rollout so the job fails on failed/rolled-back updates
                  docker stack deploy --detach=false --timeout 180s -c /opt/tea-assist/product-graph-infra/stacks/tea-app/compose.yml tea-app
                  # Force-recreate tasks: stack deploy skips tag-identical images (:main) when the
                  # swarm manager cannot record the registry digest, leaving stale containers running.
                  for svc in tea-app_ai-engine tea-app_api tea-app_web-ui; do
                    for retry in 1 2 3 4 5; do
                      docker service update --force \"\$svc\" && break
                      echo \"Update of \$svc failed (attempt \$retry/5) - retrying...\"
                      sleep 10
                    done
                  done
                "; then
                  DEPLOYED=1
                  break
                fi
                echo "stack deploy lock busy (attempt $attempt/5) - retrying in 30s"
                sleep 30
              done
              if [ "$DEPLOYED" != "1" ]; then
                echo "stack deploy failed after 5 attempts"
                exit 1
              fi
            ' -s /bin/bash tea
