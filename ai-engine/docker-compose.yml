services:
  tei:
    profiles: ["full"]
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    command: --model-id Qwen/Qwen3-Embedding-0.6B --dtype float16
    restart: unless-stopped
    ports:
      - "${TEI_PORT:-8080}:80"
    volumes:
      - hf_cache:/data
    networks:
      - internal

  qdrant:
    profiles: ["minimal", "full"]
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/6333'"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  ai-engine:
    profiles: ["full"]
    build:
      context: .
      target: dev
    ports:
      - "${AI_ENGINE_PORT:-8003}:8003"
    environment:
      OPENCODE_ZEN_API_KEY: ${OPENCODE_ZEN_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-tei}
      TEI_BASE_URL: http://tei:80/v1
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      DATABASE_URL: postgresql+asyncpg://<REDACTED>@localhost/portfolio
    depends_on:
      tei:
        condition: service_started
      qdrant:
        condition: service_healthy
    volumes:
      - ai_engine_config:/data
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G

volumes:
  hf_cache:
  qdrant_data:
  ai_engine_config:

networks:
  internal:
    driver: bridge
