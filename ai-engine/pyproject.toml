[project]
name = "product-graph-ai-engine"
version = "0.1.0"
description = "AI Engine - Product description generation and RAG chat"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "uvicorn[standard]>=0.52.3",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.15.0",
    "openai>=3.0.0",
    "httpx2>=2.10.0",
    "qdrant-client>=1.19.0",
    "httpx>=0.28.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "asyncpg>=0.30.0",
    "cryptography>=50.0.0",
    "sentence-transformers>=5.7.0",
    "loguru>=0.7.3",
    "rich>=15.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.16.3",
    "mypy>=1.14.0",
    "pre-commit>=4.6.2",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
]

[tool.ruff]
target-version = "py312"
line-length = 200

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
no_implicit_optional = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-v --cov=app --cov-report=term-missing --cov-fail-under=50"

[tool.hatch.build.targets.wheel]
packages = ["app", "scripts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
