name: CI/CD

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "24"
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/tea-assist/product-graph-web-ui

permissions:
  contents: read
  packages: write

jobs:
  quality:
    runs-on: [self-hosted, tea-server]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore npm cache
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  build-and-push:
    runs-on: [self-hosted, tea-server]
    needs: quality
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        shell: bash
        run: |
          set -e
          for attempt in 1 2 3; do
            if docker buildx build --file Dockerfile --target production \
                --push --tag "$IMAGE_NAME:main" \
                --build-arg NEXT_PUBLIC_API_URL=https://portfolio.example.invalid/api/v1 \
                --build-arg NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }} \
                --build-arg GIT_SHA=${{ github.sha }} \
                --cache-from type=gha --cache-to type=gha,mode=max \
                .; then
              exit 0
            fi
            echo "Build failed (attempt $attempt/3) - retrying after 30s"
            sleep 30
            docker system prune -af >/dev/null 2>&1 || true
          done
          exit 1

  docker:
    runs-on: [self-hosted, tea-server]
    needs: quality
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/staging'
    steps:
      - uses: actions/checkout@v7

      - name: Determine environment
        id: env
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          case "$BRANCH" in
            staging)
              echo "name=staging" >> "$GITHUB_OUTPUT"
              echo "api_url=https://portfolio.example.invalid/api/v1" >> "$GITHUB_OUTPUT"
              ;;
            develop)
              echo "name=development" >> "$GITHUB_OUTPUT"
              echo "api_url=https://portfolio.example.invalid/api/v1" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        shell: bash
        run: |
          set -e
          for attempt in 1 2 3; do
            if docker buildx build --file Dockerfile --target production \
                --tag "product-graph-web-ui:${{ github.sha }}" \
                --build-arg NEXT_PUBLIC_API_URL=${{ steps.env.outputs.api_url }} \
                --build-arg NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }} \
                --build-arg GIT_SHA=${{ github.sha }} \
                --cache-from type=gha --cache-to type=gha,mode=max \
                .; then
              exit 0
            fi
            echo "Build failed (attempt $attempt/3) - retrying after 30s"
            sleep 30
            docker system prune -af >/dev/null 2>&1 || true
          done
          exit 1

  deploy:
    runs-on: [self-hosted, tea-server]
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy stack via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: 192.0.2.10
          username: tea
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 600s
          script: |
            printf '%s\n' '${{ secrets.SERVER_PASSWORD }}' | su -c '
              set -a && source /opt/tea-assist/product-graph-infra/.env && set +a
              echo "Logging in to ghcr.io..."
              echo "${{ secrets.GHCR_PULL_TOKEN }}" | docker login ghcr.io -u radiophp --password-stdin || { echo "FATAL: ghcr.io login failed - check GHCR_PULL_TOKEN secret"; exit 1; }
              echo "Pulling images (a failed pull must abort the deploy, otherwise stale containers keep running)..."
              for img in product-graph-ai-engine product-graph-api product-graph-web-ui; do
                docker pull "ghcr.io/tea-assist/$img:main" || { echo "FATAL: docker pull of $img:main failed - aborting deploy"; exit 1; }
              done
              # Serialize stack updates across repos with flock+retry: concurrent deploy
              # jobs can hit "update out of sequence" on the same service.
              DEPLOYED=0
              for attempt in 1 2 3 4 5; do
                if flock -w 300 /tmp/tea-stack-deploy.lock bash -c "
                  # --detach=false: wait for the rollout so the job fails on failed/rolled-back updates
                  docker stack deploy --detach=false --timeout 180s -c /opt/tea-assist/product-graph-infra/stacks/tea-app/compose.yml tea-app
                  # Force-recreate tasks: stack deploy skips tag-identical images (:main) when the
                  # swarm manager cannot record the registry digest, leaving stale containers running.
                  for svc in tea-app_ai-engine tea-app_api tea-app_web-ui; do
                    for retry in 1 2 3 4 5; do
                      docker service update --force \"\$svc\" && break
                      echo \"Update of \$svc failed (attempt \$retry/5) - retrying...\"
                      sleep 10
                    done
                  done
                "; then
                  DEPLOYED=1
                  break
                fi
                echo "stack deploy lock busy (attempt $attempt/5) - retrying in 30s"
                sleep 30
              done
              if [ "$DEPLOYED" != "1" ]; then
                echo "stack deploy failed after 5 attempts"
                exit 1
              fi
            ' -s /bin/bash tea
